name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}
  schedule: [{ cron: "17 6 * * *" }]   # a bump merged and never tagged keeps failing here
permissions: { contents: read }
jobs:
  test:
    name: tests and the samples rebuild from source
    runs-on: ubuntu-latest
    env: { OFFICE_PDF_TESTS: "1" }   # the real conversion, with the glibc build
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked --all-extras
      - run: uv run publishing setup --with-deps --video --convert
      # User-content mode runs Chromium with its sandbox on, which needs unprivileged user namespaces;
      # Ubuntu 24.04 restricts them through AppArmor (docs/user-content.md, "Hosts").
      - name: allow unprivileged user namespaces (Chromium's sandbox)
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv run pytest -q
      - run: uv run publishing check

  tags:
    name: every released version (pyproject bump) has its tag
    # A post-merge invariant: the tag exists only after the bump merges (release automation), so a
    # version-bump PR can never satisfy it. Checked on main, nightly and by hand, not on pull_request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, fetch-tags: true }
      - run: tools/tag-check.sh

  budget:
    name: CI time budget report (nightly, informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { contents: read, actions: read }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci-budget.sh | tee -a "$GITHUB_STEP_SUMMARY"

  action:
    name: the GitHub Action checks a scratch repo (passes, then fails on a stale PDF)
    runs-on: ubuntu-latest
    env: { PUBLISHING_FROM: "${{ github.workspace }}" }   # this checkout, not the pinned tag 
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: tools/action-check.sh

  user-content-container:
    name: user-content mode in a locked-down container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: the host's user-namespace setting (left as the runner has it)
        run: sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - run: tools/usercontent-check.sh

  convert:
    name: convert profile on Alpine, real conversion with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.convert --target test -t publishing-convert:ci .
      - run: docker run --rm --network none publishing-convert:ci
      - run: docker build -f Dockerfile.convert -t publishing-convert:run .
      - name: the image converts a file it is given, and nothing reaches the network
        run: |
          set -euo pipefail
          mkdir -p work && chmod 777 work
          python3 - <<'EOF'
          import base64, re
          src = open("tests/test_convert_integration.py").read()
          open("work/fixture.docx", "wb").write(base64.b64decode("".join(re.findall(r'"(UEsD[^"]+)"', src))))
          EOF
          docker run --rm --network none -v "$PWD/work:/work" publishing-convert:run fixture.docx
          test "$(head -c 5 work/fixture.pdf)" = "%PDF-"

  pandoc:
    name: pandoc profile in a container, real conversions with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.pandoc --target test -t publishing-pandoc:ci .
      - run: docker run --rm --network none publishing-pandoc:ci
      - run: docker build -f Dockerfile.pandoc -t publishing-pandoc:run .
      - name: the image converts any to any with a read-only root, and nothing reaches the network
        run: |
          set -euo pipefail
          mkdir -p work && chmod 777 work
          printf '# Hello\n\nWorld, café.\n' > work/in.md
          run() { docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
                    --user 65532:65532 -v "$PWD/work:/work" publishing-pandoc:run "$@"; }
          run in.md
          run in.md -o out.docx
          run out.docx --to html
          run in.md -o again.pdf
          test "$(head -c 5 work/in.pdf)" = "%PDF-"
          test "$(head -c 2 work/out.docx)" = "PK"
          grep -q '<h1' work/out.html
          cmp work/in.pdf work/again.pdf

  extract:
    name: extract profile in a container, with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.extract --target test -t publishing-extract:ci .
      - run: docker run --rm --network none publishing-extract:ci
      - run: docker build -f Dockerfile.extract -t publishing-extract:run .
      - name: the image extracts a file it is given, and nothing reaches the network
        run: |
          set -euo pipefail
          mkdir -p work && chmod 777 work
          printf '<h1>Hello</h1><p>World</p>' > work/in.html
          docker run --rm --network none -v "$PWD/work:/work" publishing-extract:run in.html
          grep -q '^# Hello' work/in.md

  media:
    name: media profile in a container, with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.media --target test -t publishing-media:ci .
      - run: docker run --rm --network none publishing-media:ci
      - run: docker build -f Dockerfile.media -t publishing-media:run .
      - name: the image transcodes a file it is given, and nothing reaches the network
        run: |
          set -euo pipefail
          mkdir -p work && chmod 777 work
          docker run --rm --entrypoint ffmpeg -v "$PWD/work:/work" publishing-media:run -v error \
            -f lavfi -i testsrc=size=64x64:rate=5:duration=1 -f lavfi -i sine=duration=1 -c:v libx264 \
            -pix_fmt yuv420p -c:a aac -shortest /work/in.mp4
          docker run --rm --network none -v "$PWD/work:/work" publishing-media:run audio in.mp4 -o out.mp3
          docker run --rm --network none -v "$PWD/work:/work" publishing-media:run thumbnail in.mp4 -o out.png
          test "$(head -c 4 work/out.png | tail -c 3)" = "PNG"
          test -s work/out.mp3

  images:
    name: images profile in a container, with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.images --target test -t publishing-images:ci .
      - run: docker run --rm --network none publishing-images:ci
      - run: docker build -f Dockerfile.images -t publishing-images:run .
      - name: the image resizes a file it is given, read-only, and nothing reaches the network
        run: |
          set -euo pipefail
          mkdir -p work && chmod 777 work
          docker run --rm --entrypoint python -v "$PWD/work:/work" publishing-images:run \
            -c "from PIL import Image; Image.new('RGB', (300, 200), 'red').save('/work/in.jpg')"
          docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD/work:/work" publishing-images:run thumbnail in.jpg -o out.png --size 128
          test "$(head -c 4 work/out.png | tail -c 3)" = "PNG"

  pdf:
    name: pdf profile in a container, with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.pdf --target test -t publishing-pdf:ci .
      - run: docker run --rm --network none publishing-pdf:ci
      - run: docker build -f Dockerfile.pdf -t publishing-pdf:run .
      - name: the image merges files it is given, read-only, and nothing reaches the network
        run: |
          set -euo pipefail
          mkdir -p work && chmod 777 work
          docker run --rm --entrypoint python -v "$PWD/work:/work" publishing-pdf:run \
            -c "from pypdf import PdfWriter
          for n in 'a', 'b':
              w = PdfWriter(); w.add_blank_page(200, 100); w.write(f'/work/{n}.pdf')"
          docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD/work:/work" publishing-pdf:run merge a.pdf b.pdf -o out.pdf
          test "$(head -c 5 work/out.pdf)" = "%PDF-"

  render-golden:
    name: render golden fixtures in the toolbox image, with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test -t publishing:golden .
      - run: docker run --rm --network none publishing:golden

  image:
    name: the container image renders headless and reproduces its own bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t publishing:ci .
      - name: check every sample in the image (the service entry)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" publishing:ci check
      - name: two renders in the image are byte-identical
        run: |
          mkdir -p out
          for i in 1 2; do
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" publishing:ci \
              build docs/samples/house-style-video-v1 -o /work/out/render-$i.mp4
          done
          cmp out/render-1.mp4 out/render-2.mp4
      - name: user-content mode in the same image, under docs/user-content.md's flags
        run: |
          mkdir -p doc pdf && chmod 777 pdf && echo '<p>Hello from a person.</p>' > doc/page.html
          docker run --rm --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp="$PWD/ci/seccomp-chromium.json" --network none --read-only --tmpfs /tmp \
            --memory 2g --pids-limit 512 -v "$PWD/doc:/in:ro" -v "$PWD/pdf:/out" \
            publishing:ci html /in/page.html -o /out/page.pdf --json
          test -s pdf/page.pdf
      - name: render-html in the same image and flags, with page images and a thumbnail
        run: |
          printf '<p>Page one.</p><p style="break-before:page">Page two.</p>' > doc/two.html
          docker run --rm --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp="$PWD/ci/seccomp-chromium.json" --network none --read-only --tmpfs /tmp \
            --memory 2g --pids-limit 512 -v "$PWD/doc:/in:ro" -v "$PWD/pdf:/out" \
            publishing:ci render-html /in/two.html --pdf /out/two.pdf --png /out/pages --thumbnail 320 --json \
            | tee render.json
          grep -q '"sandboxed": true' render.json && grep -q '"pages": 2' render.json
          test -s pdf/two.pdf && test -s pdf/pages/page-002.png && test -s pdf/pages/thumbnail.png
      - name: Office to PDF in the same image, with no network
        run: |
          python3 - <<'EOF'
          import base64, re
          src = open("tests/test_convert_integration.py").read()
          open("doc/fixture.docx", "wb").write(base64.b64decode("".join(re.findall(r'"(UEsD[^"]+)"', src))))
          EOF
          docker run --rm --user 65532:65532 --network none -v "$PWD/doc:/in:ro" -v "$PWD/pdf:/out" \
            publishing:ci convert /in/fixture.docx -o /out/fixture.pdf
          test "$(head -c 5 pdf/fixture.pdf)" = "%PDF-"
      - name: the toolbox's extract, and the default flags refuse the sandbox with exit 3 (docs/service.md)
        run: |
          set -u
          docker run --rm --user 65532:65532 --network none --read-only --tmpfs /tmp \
            -v "$PWD/doc:/in:ro" -v "$PWD/pdf:/out" publishing:ci extract /in/page.html -o /out/page.md
          grep -q 'Hello from a person' pdf/page.md
          for c in "html /in/page.html -o /out/d1.pdf" "render-html /in/page.html --pdf /out/d2.pdf"; do
            rc=0
            docker run --rm --user 65532:65532 --network none --read-only --tmpfs /tmp \
              -v "$PWD/doc:/in:ro" -v "$PWD/pdf:/out" publishing:ci $c || rc=$?
            test "$rc" = 3 || { echo "FAIL: '$c' exited $rc, wanted 3"; exit 1; }
          done
      - name: examples/service/run.sh checks the samples (decks and videos run trusted, not in user-content mode)
        run: PUBLISHING_IMAGE=publishing:ci examples/service/run.sh check
