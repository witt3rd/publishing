<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 0 1760 440" font-family="Noto Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b4bd6"/></marker>
  </defs>
  <g text-anchor="middle">
    <rect x="40" y="250" width="330" height="130" rx="18" fill="#fff" stroke="#5b4bd6" stroke-width="3"/>
    <text x="205" y="305" font-size="30" font-weight="800" fill="#1d2433">Neighbours</text>
    <text x="205" y="345" font-size="22" fill="#4a5163">give spare tools</text>
    <rect x="450" y="250" width="330" height="130" rx="18" fill="#5b4bd6"/>
    <text x="615" y="305" font-size="30" font-weight="800" fill="#fff">The ledger</text>
    <text x="615" y="345" font-size="22" fill="#e4e0ff">one line per tool</text>
    <rect x="860" y="250" width="330" height="130" rx="18" fill="#fff" stroke="#5b4bd6" stroke-width="3"/>
    <text x="1025" y="305" font-size="30" font-weight="800" fill="#1d2433">The shed</text>
    <text x="1025" y="345" font-size="22" fill="#4a5163">tools hung on labelled hooks</text>
    <rect x="1270" y="250" width="330" height="130" rx="18" fill="#fff" stroke="#5b4bd6" stroke-width="3"/>
    <text x="1435" y="305" font-size="30" font-weight="800" fill="#1d2433">Borrowers</text>
    <text x="1435" y="345" font-size="22" fill="#4a5163">use it, clean it, return it</text>
    <text x="840" y="146" font-size="24" font-weight="700" fill="#5b4bd6">every tool comes back within the week</text>
  </g>
  <g fill="none" stroke="#5b4bd6" stroke-width="5">
    <path d="M374 315 L444 315" marker-end="url(#a)"/>
    <path d="M784 315 L854 315" marker-end="url(#a)"/>
    <path d="M1194 315 L1264 315" marker-end="url(#a)"/>
    <path d="M1435 244 L1435 180 L205 180 L205 244" marker-end="url(#a)"/>
  </g>
