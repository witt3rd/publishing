[project]
name = "publishing"
version = "0.5.0"
description = "House-style publishing toolchain: decks, memos and long documents to PDF, videos to MP4, HTML to PDF and page images, Office files to PDF"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Install profiles are extras: `publishing[render]` builds decks, memos and documents (Playwright and
# Chromium) and runs render-html, render-md and pdf-pages (Chromium and PDFium, from pypdfium2);
# `publishing[video]` adds videos to it; `publishing[convert]` turns Office files into PDFs
# with the standard library and the office2pdf binary that `publishing setup --convert` installs
# (pinned in src/publishing/convert.py). The convert profile needs neither Playwright nor Chromium, so
# it installs on musl (Alpine).
dependencies = []

[project.optional-dependencies]
# Exact pins: the tool's version is the rendering contract, so its renderer is pinned too.
render = [
  "playwright==1.63.0",     # Chromium build 1243
  "markdown-it-py==4.2.0",
  "mdit-py-plugins==0.6.1",
  "pygments==2.21.0",
  "pypdf==6.19.0",
  "pypdfium2==5.13.0",
  "pillow==12.3.0",
]
# The video format: the render profile, and HyperFrames on this Node (>=22); HyperFrames' own version is
# pinned in src/publishing/hyperframes/package-lock.json and installed by `publishing setup --video`.
video = ["publishing[render]", "nodejs-wheel-binaries==24.19.0"]
convert = []
# Documents to markdown through markitdown (exact pin; every parser it needs is pinned in uv.lock). No
# Playwright, no Chromium; no audio, speech or LLM extras. onnxruntime (markitdown's file-type detector,
# magika) is pinned to a release with wheels for Python 3.11-3.14; it has no musl wheel, so this profile
# is glibc only (README "Extract").
extract = ["markitdown[pdf,docx,pptx,xlsx]==0.1.8", "onnxruntime==1.30.0"]

[project.scripts]
publishing = "publishing.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publishing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
