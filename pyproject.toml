[project]
name = "publishing"
version = "0.2.0"
description = "House-style publishing toolchain: decks, memos and long documents to PDF, videos to MP4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Exact pins: the tool's version is the rendering contract, so its renderer is pinned too.
dependencies = [
  "playwright==1.63.0",     # Chromium build 1243
  "markdown-it-py==4.2.0",
  "mdit-py-plugins==0.6.1",
  "pygments==2.21.0",
  "pypdf==6.19.0",
  "pypdfium2==5.13.0",
  "pillow==12.3.0",
]

[project.optional-dependencies]
# The video format: HyperFrames runs on this Node (>=22); its own version is pinned in
# src/publishing/video/package-lock.json and installed by `publishing setup --video`.
video = ["nodejs-wheel-binaries==24.19.0"]

[project.scripts]
publishing = "publishing.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publishing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
